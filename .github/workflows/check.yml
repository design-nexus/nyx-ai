# This repository built and tested as NyxOS ships it: nyx-packages' recipe for nyx-ai,
# with this commit in place of its pinned source (the recipe's tests run in the build).
# Dependencies come from the NyxOS binary cache, read-only.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nyxos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nyxos
      - name: Build and test the package
        run: |
          nix build --print-build-logs "github:nyxos-project/nyx-packages#nyx-ai" \
            --override-input nyx-ai "path:$GITHUB_WORKSPACE"
